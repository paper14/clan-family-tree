<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clan Family Tree — Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style id="page-size"></style>
<style>
/* ---------- tokens (Clan Family Tree design system) ---------- */
:root, [data-theme="paper"] {
  --paper:#f6f1e6; --paper-raised:#fcf9f2; --paper-sunk:#ede6d6; --rule:#d8cdb8; --rule-strong:#8c7f69;
  --ink:#241e17; --ink-muted:#5e5446; --lineage:#2e5236; --lineage-soft:#e2ebdf; --on-lineage:#ffffff;
  --gilt:#7d5f14; --gilt-soft:#f1e6c8; --spouse:#5a6570; --living:#245a78; --living-soft:#dfeaf0;
  --warn:#8a5300; --warn-soft:#f6e5c6; --danger:#a02a1c; --danger-soft:#f7dfd9; --focus:#245a78;
  --shadow-sm:0 1px 2px #241e1714; --shadow-lg:0 6px 20px -4px #241e172e;
  --focus-ring:0 0 0 2px #f6f1e6, 0 0 0 4px #245a78;
}
[data-theme="lamplight"] {
  --paper:#1c1a17; --paper-raised:#25221e; --paper-sunk:#151310; --rule:#3b362f; --rule-strong:#857a67;
  --ink:#eee6d8; --ink-muted:#b0a590; --lineage:#93c49c; --lineage-soft:#1f3024; --on-lineage:#1c1a17;
  --gilt:#d8b565; --gilt-soft:#352b14; --spouse:#a2afbb; --living:#8cc4e0; --living-soft:#17303d;
  --warn:#e8b25a; --warn-soft:#3a2a0c; --danger:#f19684; --danger-soft:#3f1a14; --focus:#8cc4e0;
  --shadow-sm:0 1px 2px #00000080; --shadow-lg:0 8px 24px -4px #000000b3;
  --focus-ring:0 0 0 2px #1c1a17, 0 0 0 4px #8cc4e0;
}
[data-theme="print"] {
  --paper:#ffffff; --paper-raised:#ffffff; --paper-sunk:#f2f2f2; --rule:#bdbdbd; --rule-strong:#555555;
  --ink:#000000; --ink-muted:#333333; --lineage:#1f3d26; --lineage-soft:#ffffff; --on-lineage:#ffffff;
  --gilt:#5c4508; --gilt-soft:#ffffff; --spouse:#444444; --living:#1d4a63; --living-soft:#ffffff;
  --warn:#6b4000; --warn-soft:#ffffff; --danger:#8a1f13; --danger-soft:#ffffff; --focus:#000000;
  --shadow-sm:none; --shadow-lg:none; --focus-ring:none;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-8:48px;
  --radius-sm:2px; --radius-md:4px;
  --font-serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  --font-sans:"Source Sans 3","Source Sans Pro","Segoe UI",system-ui,sans-serif;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin:0; height:100%; }
body { font-family:var(--font-sans); font-size:15px; line-height:22px; background:var(--paper); color:var(--ink); }
a { color:var(--lineage); }
a:hover { color:var(--ink); }
h1,h2,h3 { margin:0; }
.serif { font-family:var(--font-serif); }
.muted { color:var(--ink-muted); }
.small { font-size:13px; line-height:18px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid transparent; box-shadow:var(--focus-ring); }

/* ---------- shell ---------- */
.app { display:flex; min-height:100vh; }
.side { width:232px; flex-shrink:0; padding:28px 16px 24px; display:flex; flex-direction:column; gap:28px; background:var(--paper-raised); border-right:1px solid var(--rule); position:sticky; top:0; height:100vh; }
.brand { padding:0 8px; }
.brand .t { font-family:var(--font-serif); font-size:22px; line-height:26px; font-weight:600; }
.nav { display:flex; flex-direction:column; gap:2px; }
.nav a { display:flex; align-items:center; justify-content:space-between; min-height:44px; padding:0 12px; border-radius:var(--radius-md); color:var(--ink); text-decoration:none; }
.nav a:hover { background:var(--paper-sunk); }
.nav a.on { background:var(--lineage-soft); color:var(--lineage); font-weight:600; }
.side .grow { flex-grow:1; }
.box { padding:16px; border:1px solid var(--rule); border-radius:var(--radius-md); background:var(--paper); display:flex; flex-direction:column; gap:8px; }
main { flex-grow:1; min-width:0; padding:32px 48px 48px; }
.page-head { display:flex; align-items:flex-end; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.page-head .grow { flex-grow:1; display:flex; flex-direction:column; gap:4px; min-width:260px; }
.display { font-family:var(--font-serif); font-size:40px; line-height:44px; font-weight:600; letter-spacing:-.01em; }
.crumbs { font-size:13px; line-height:18px; color:var(--ink-muted); display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- components ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font:600 15px/20px var(--font-sans); min-height:40px; padding:0 16px; border-radius:var(--radius-md); border:1px solid var(--rule-strong); background:var(--paper-raised); color:var(--ink); cursor:pointer; text-decoration:none; white-space:nowrap; }
.btn:hover { background:var(--paper-sunk); color:var(--ink); }
.btn.primary { background:var(--lineage); border-color:var(--lineage); color:var(--on-lineage); }
.btn.primary:hover { filter:brightness(1.08); color:var(--on-lineage); }
.btn.danger { background:var(--danger); border-color:var(--danger); color:var(--on-lineage); }
.btn.danger:hover { filter:brightness(1.08); color:var(--on-lineage); }
.btn.link { border-color:transparent; background:transparent; color:var(--lineage); text-decoration:underline; text-underline-offset:3px; padding:0 8px; }
.btn.sm { min-height:32px; padding:0 10px; font-size:13px; }
.btn.icon { width:40px; padding:0; }
.field { display:flex; flex-direction:column; gap:4px; min-width:0; }
.label { font:600 13px/18px var(--font-sans); }
.label .req { font-weight:400; color:var(--ink-muted); margin-left:8px; }
.sub { font:400 13px/18px var(--font-sans); color:var(--ink-muted); }
.input { font:400 15px/22px var(--font-sans); background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:var(--radius-sm); padding:8px 12px; width:100%; min-width:0; color:var(--ink); }
select.input { padding:8px 8px; }
textarea.input { min-height:88px; resize:vertical; }
.input::placeholder { color:var(--ink-muted); }
.field.clan .label { color:var(--lineage); }
.field.clan .input { border:2px solid var(--lineage); padding:7px 11px; }
.field.err .input { border:2px solid var(--danger); padding:7px 11px; }
.hint { font:400 13px/18px var(--font-sans); color:var(--ink-muted); }
.hint.error { color:var(--danger); }
.check { display:flex; gap:10px; align-items:flex-start; font-size:15px; line-height:22px; cursor:pointer; }
.check input { width:18px; height:18px; margin:2px 0 0; flex-shrink:0; accent-color:var(--lineage); }
.radios { display:flex; gap:20px; flex-wrap:wrap; }
.radios label { display:flex; gap:8px; align-items:center; min-height:36px; cursor:pointer; }
.radios input { width:18px; height:18px; margin:0; accent-color:var(--lineage); }
.badge { display:inline-block; font:600 11px/16px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:var(--radius-sm); background:var(--paper-sunk); color:var(--ink-muted); white-space:nowrap; }
.badge.lineage { background:var(--lineage-soft); color:var(--lineage); }
.badge.gilt { background:var(--gilt-soft); color:var(--gilt); }
.badge.living { background:var(--living-soft); color:var(--living); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.danger { background:var(--danger-soft); color:var(--danger); }
[data-theme="print"] .badge { border:1px solid currentColor; }
.gen { font:600 11px/16px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--gilt); }
.card { background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius-md); padding:24px; display:flex; flex-direction:column; gap:16px; min-width:0; }
.card h2 { font-size:18px; line-height:24px; font-weight:600; }
.note { padding:10px 12px; border-radius:var(--radius-sm); font-size:13px; line-height:18px; }
.note.warn { background:var(--warn-soft); } .note.warn b { color:var(--warn); }
.note.error { background:var(--danger-soft); } .note.error b { color:var(--danger); }
.note.info { background:var(--lineage-soft); } .note.info b { color:var(--lineage); }
.grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.stack { display:flex; flex-direction:column; gap:16px; }
.photo { flex:none; width:40px; height:40px; border-radius:var(--radius-sm); background:var(--paper-sunk); color:var(--ink-muted); display:grid; place-items:center; font:600 13px/1 var(--font-serif); overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; }
.photo.lg { width:112px; height:112px; font-size:32px; border:1px solid var(--rule); }

/* person node (small card) */
.pnode { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; padding:11px; background:var(--paper-raised); color:var(--ink); border:1px solid var(--rule-strong); border-radius:var(--radius-md); cursor:pointer; text-decoration:none; }
.pnode.clan { border:2px solid var(--lineage); padding:10px; }
.pnode:hover { background:var(--paper-sunk); color:var(--ink); }
.pnode .nm { font:600 17px/22px var(--font-serif); }
.pnode .nk { font-weight:400; font-style:italic; }
.pnode .dt { font-size:13px; line-height:18px; color:var(--ink-muted); }
.pnode .tx { display:flex; flex-direction:column; gap:2px; min-width:0; align-items:flex-start; }

/* people list */
.list { background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius-md); overflow:hidden; }
.lrow { display:grid; grid-template-columns:3rem minmax(0,1fr) 150px minmax(170px,auto); gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--rule); text-decoration:none; color:var(--ink); }
.lrow:last-child { border-bottom:0; }
a.lrow:hover, div.lrow:hover { background:var(--paper-sunk); color:var(--ink); }
.lrow .n a { color:var(--ink); text-decoration:none; } .lrow .n a:hover { text-decoration:underline; }
.lhead { font:600 11px/16px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); border-bottom:1px solid var(--rule-strong); }
.lrow .g { font:600 13px/18px var(--font-serif); color:var(--gilt); text-align:right; font-variant-numeric:tabular-nums; }
.lrow .n { font:600 17px/22px var(--font-serif); }
.lrow .p { font-size:13px; line-height:18px; color:var(--ink-muted); }
.lrow .d { font-size:13px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
.lrow .f { display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap; }
.filters { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }

/* tree */
.tree-wrap { position:relative; background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius-md); overflow:auto; height:calc(100vh - 290px); min-height:420px; }
.tree { position:relative; transform-origin:0 0; }
.tree svg { position:absolute; left:0; top:0; overflow:visible; }
.tn { position:absolute; display:flex; gap:10px; align-items:flex-start; padding:10px; background:var(--paper-raised); color:var(--ink); border:1px solid var(--rule-strong); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); text-align:left; overflow:hidden; text-decoration:none; }
.tn.clan { border:2px solid var(--lineage); padding:9px; }
.tn.founder { background:var(--gilt-soft); }
.tn.sel { background:var(--lineage-soft); }
a.tn:hover { background:var(--paper-sunk); color:var(--ink); }
.tn .tx { display:flex; flex-direction:column; gap:1px; min-width:0; }
.tn .nm { font:600 16px/20px var(--font-serif); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tn .nk { font-weight:400; font-style:italic; }
.tn .dt { font-size:12px; line-height:16px; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tn .hid { font-size:11px; line-height:14px; color:var(--warn); }
.tn .photo { width:36px; height:36px; }
.join { position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--spouse); font:600 18px/1 var(--font-serif); }
.join span { font:400 10px/12px var(--font-sans); margin-top:2px; white-space:nowrap; }
.legend { display:flex; gap:20px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--ink-muted); margin-top:12px; }
.seg { display:inline-flex; border:1px solid var(--rule-strong); border-radius:var(--radius-md); overflow:hidden; background:var(--paper-raised); }
.seg button { min-width:40px; min-height:38px; border:0; background:transparent; cursor:pointer; }
.seg button.on { background:var(--lineage); color:var(--on-lineage); font-weight:600; }

/* add-children rows */
.kids { background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius-md); overflow-x:auto; }
.krow { display:grid; grid-template-columns:28px minmax(120px,1.3fr) minmax(90px,1fr) minmax(100px,1.1fr) minmax(90px,1fr) 110px minmax(110px,1fr) 150px 120px 40px; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--rule); min-width:1080px; }
.krow.h { font:600 11px/16px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); border-bottom:1px solid var(--rule-strong); }
.krow .input { padding:6px 8px; }

/* print */
.sheet-wrap { background:var(--paper-sunk); border-radius:var(--radius-md); padding:20px; overflow:hidden; }
.sheet { background:#fff; box-shadow:var(--shadow-lg); position:relative; overflow:hidden; margin:0 auto; }
#print-root { display:none; }
.outline { font-size:11pt; line-height:1.45; color:#000; }
.outline h1 { font-family:var(--font-serif); font-size:20pt; margin:0 0 4pt; }
.outline .meta { font-size:9pt; color:#333; border-bottom:1.5px solid #000; padding-bottom:8pt; margin-bottom:10pt; }
.outline .ln { display:flex; gap:8pt; break-inside:avoid; }
.outline .ln .gn { width:14pt; text-align:right; font-weight:600; flex-shrink:0; }
.outline .ln b { font-family:var(--font-serif); }
.outline .ln .dd { color:#333; }

.toast { position:fixed; right:24px; bottom:24px; background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:var(--radius-md); box-shadow:var(--shadow-lg); font-size:15px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; z-index:10; max-width:420px; }
.toast.on { opacity:1; transform:none; }

/* ---------- v0.8 additions ---------- */
.clan-pick { display:flex; flex-direction:column; gap:4px; padding:0 8px; }
.clan-pick select { font:600 15px/20px var(--font-serif); }
.nav .sep { height:1px; background:var(--rule); margin:8px 4px; }
.clancards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
.clancard { display:flex; flex-direction:column; gap:12px; padding:24px; background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius-md); }
.clancard.cur { border:2px solid var(--lineage); padding:23px; }
.clancard .nm { font:600 26px/30px var(--font-serif); }
.stats { display:flex; gap:20px; font-size:13px; color:var(--ink-muted); }
.stats b { display:block; font:600 22px/26px var(--font-serif); color:var(--ink); }
.caption { font-size:13px; line-height:18px; color:var(--ink-muted); font-style:italic; }
.tn .oc { font-size:11px; line-height:14px; color:var(--spouse); font-weight:600; }
.oln { display:flex; gap:10px; align-items:baseline; padding:5px 8px; border-bottom:1px solid var(--rule); }
.oln:hover { background:var(--paper-sunk); }
.oln .ogen { width:24px; flex-shrink:0; text-align:right; font:600 13px/18px var(--font-serif); color:var(--gilt); }
.oln .opos { min-width:22px; flex-shrink:0; font-size:13px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
.oln .onm { font:600 16px/22px var(--font-serif); color:var(--ink); text-decoration:none; }
.oln .onm:hover { text-decoration:underline; }
.oln .odt { font-size:13px; color:var(--ink-muted); }
.oln .osp { font-size:14px; }
.oln .ocount { font-size:12px; color:var(--ink-muted); white-space:nowrap; }
.otg { width:24px; height:24px; flex-shrink:0; border:1px solid var(--rule-strong); border-radius:var(--radius-sm); background:var(--paper-raised); color:var(--ink); cursor:pointer; font-size:12px; line-height:1; padding:0; align-self:center; }
.otg.none { visibility:hidden; }
.otg.cut { border-style:dashed; color:var(--ink-muted); cursor:default; }
mark { background:var(--warn-soft); color:var(--ink); outline:1px solid var(--warn); border-radius:2px; padding:0 1px; }
.ttg { position:absolute; height:20px; min-width:24px; padding:0 6px; border:1px solid var(--rule-strong); border-radius:10px; background:var(--paper-raised); color:var(--ink); font:600 11px/18px var(--font-sans); cursor:pointer; z-index:2; }
.tmore { position:absolute; font:400 11px/14px var(--font-sans); color:var(--ink-muted); text-align:center; white-space:nowrap; }
.sibrow { display:flex; gap:8px; align-items:center; }
.sibrow .pos { width:22px; flex-shrink:0; text-align:right; font:600 15px var(--font-serif); color:var(--gilt); }
.sibrow .mv { display:flex; flex-direction:column; gap:2px; }
.sibrow .mv .btn { width:32px; min-height:26px; padding:0; }
.mres { display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:8px 10px; border:1px solid var(--rule); border-radius:var(--radius-sm); background:var(--paper-raised); cursor:pointer; color:var(--ink); }
.mres:hover { background:var(--paper-sunk); }
.phs { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
.ph { margin:0; border:1px solid var(--rule); border-radius:var(--radius-md); background:var(--paper); overflow:hidden; display:flex; flex-direction:column; }
.ph.primary { border:2px solid var(--gilt); }
.ph img { width:100%; height:130px; object-fit:cover; background:var(--paper-sunk); display:block; }
.ph figcaption { padding:8px 10px; font-size:13px; line-height:18px; display:flex; flex-direction:column; gap:6px; }
.ph .acts { display:flex; gap:4px; flex-wrap:wrap; }
.phgrp { display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid var(--rule); }
.phgrp:first-of-type { border-top:0; padding-top:0; }
.phgrp h3 { font-size:15px; line-height:20px; font-weight:600; margin:0; }
.phform { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) 110px; gap:12px; align-items:end; padding:12px; border:1px dashed var(--rule-strong); border-radius:var(--radius-sm); background:var(--paper); }
.clan-banner { width:calc(100% + 48px); margin:-24px -24px 0; height:140px; object-fit:cover; border-radius:var(--radius-md) var(--radius-md) 0 0; display:block; }
.oln .othumb { width:28px; height:28px; border-radius:var(--radius-sm); object-fit:cover; align-self:center; flex-shrink:0; background:var(--paper-sunk); }
.lrow .tr { font-size:13px; font-weight:600; white-space:nowrap; }
.xclan { position:absolute; height:20px; padding:0 8px; border:1px dashed var(--spouse); border-radius:10px; background:var(--paper-raised); color:var(--spouse); font:600 11px/18px var(--font-sans); white-space:nowrap; cursor:pointer; z-index:2; }
.xclan:hover { background:var(--paper-sunk); }
.xclan-print { position:absolute; font:italic 11px/14px var(--font-sans); color:#333; white-space:nowrap; }
.panel-warn { border:2px solid var(--warn); border-radius:var(--radius-md); padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--warn-soft); }
@media (max-width: 900px) {
  .app { flex-direction:column; } .side { width:auto; height:auto; position:static; }
  main { padding:24px 16px; } .grid3,.grid2 { grid-template-columns:minmax(0,1fr); }
  .lrow { grid-template-columns:2rem minmax(0,1fr); } .lrow .d, .lrow .f { grid-column:2; justify-content:flex-start; }
}
@media print {
  html, body { background:#fff !important; }
  .app, .toast { display:none !important; }
  #print-root { display:block !important; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand"><div class="t">Clan Family Tree</div><div class="small muted" id="side-sub">Demo</div></div>
    <div class="clan-pick" id="clan-pick"></div>
    <div class="nav" id="nav"></div>
    <div class="grow"></div>
    <div class="box">
      <div class="small" style="font-weight:600">Backup · all clans</div>
      <div class="small muted" id="backup-when">Never backed up</div>
      <button class="btn sm" data-act="backup">Download backup</button>
      <label class="btn sm link" style="cursor:pointer">Restore from file<input type="file" accept="application/json,.json" id="restore" class="sr"></label>
    </div>
    <div class="row" style="padding:0 4px">
      <button class="btn sm" data-act="theme" id="theme-btn">Dark theme</button>

function byId(id) { if (id == null || id === '') return null; for (var i = 0; i < S.people.length; i++) if (S.people[i].id === +id) return S.people[i]; return null; }

function cur() { var c = clanById(S.currentClan); return c && !c.deleted_at ? c : null; }
function clanOf(p) { return p ? clanById(p.clan_id) : null; }

}
function childrenOf(id, showHidden) {

  }), id);
}
function marriagesOf(id) { return S.marriages.filter(function (m) { return m.husband_id === id || m.wife_id === id; }).sort(function (a, b) { return (a.date || '9999').localeCompare(b.date || '9999'); }); }
function spouseIn(m, id) { return m.husband_id === id ? m.wife_id : m.husband_id; }

    var data = { husband_id: cpl.h ? cpl.h.id : null, wife_id: cpl.w ? cpl.w.id : null, date: fd3.get('date') || null, date_text: (fd3.get('date_text') || '').trim() || null, place: (fd3.get('place') || '').trim() || null, status: fd3.get('status'), notes: (fd3.get('notes') || '').trim() || null };
    if (mid) Object.assign(mById(mid), data); else addMarriage(data);
    M = { open: false }; save();
    toast(spp && spp.clan_id !== p.clan_id ? 'Marriage saved — it links the ' + clanLabel(clanOf(p)) + ' and the ' + clanLabel(clanOf(spp)) + '.' : spp && M.create === undefined ? 'Marriage saved.' : 'Marriage saved.');
    render();
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'f-q') { L.q = e.target.value; document.getElementById('list').innerHTML = listHtml(); }
  if (e.target.closest && e.target.closest('#print-form') && (e.target.type === 'number' || e.target.type === 'text')) drawPrintPreview();
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 'clan-sel' && e.target.value) { S.currentClan = +e.target.value; save(); var rn = route().name; go(SCOPED[rn] && rn !== 'person' && rn !== 'edit' ? '#/' + (rn === 'new' ? 'new' : rn) : '#/people'); render(); }
  if (id === 'f-root') { L.root = e.target.value; L.gen = 'all'; render(); }
  if (id === 'f-gen') { L.gen = e.target.value; document.getElementById('list').innerHTML = listHtml(); }
  if (id === 'f-show') { L.show = e.target.value; document.getElementById('list').innerHTML = listHtml(); }
  if (id === 'f-sort') { L.sort = e.target.value; document.getElementById('list').innerHTML = listHtml(); }
  if (id === 'f-founder') { F.founder = e.target.value ? +e.target.value : null; var sp = F.founder ? spousesOf(F.founder) : []; F.spouse = sp.length ? String(sp[0].id) : ''; F.backedUp = false; render(); document.getElementById('founders').scrollIntoView(); }
  if (id === 'f-spouse') { F.spouse = e.target.value; render(); document.getElementById('founders').scrollIntoView(); }
  if (id === 'restore' && e.target.files[0]) { restore(e.target.files[0]); e.target.value = ''; }
  if (id === 'i-photo' && e.target.files[0]) {
    readPhoto(e.target.files[0]).then(function (url) { pendingPhoto = url; document.getElementById('photo-prev').innerHTML = '<span class="photo lg"><img src="' + url + '" alt=""></span>'; }).catch(function () { toast('Couldn’t read that image.'); });
  }
  if (id === 'i-cp') { document.getElementById('gen-hint').textContent = genHint(byId(+e.target.value), null); }
  if (e.target.closest && e.target.closest('#print-form')) { readPrintForm(); if (P.format !== P._rendered || id === 'p-preset') render(); else drawPrintPreview(); }
  if (id === 'm-sp') { document.getElementById('m-new').style.display = e.target.value === 'new' ? '' : 'none'; }
});
window.addEventListener('hashchange', function () { PH = { add: null, edit: null }; if (route().name !== 'person') { M = { open: false }; if (K.inline) K = blankK(); } render(); });
window.addEventListener('resize', function () { if (route().name === 'print') drawPrintPreview(); });
window.addEventListener('afterprint', function () { document.getElementById('print-root').innerHTML = ''; });

/* ================= start ================= */
var loaded = load();
if (!loaded) seed();
if (!S.photos) S.photos = [];
function boot() {
  var inline = S.imgInline || {};
  if (IDB_OK) Object.keys(inline).forEach(function (k) { if (!IMG[k]) imgPut(+k, inline[k]); }); else IMG = inline;
  var hadInlinePhotos = RAW_BEFORE && RAW_BEFORE.indexOf('"photo":"data:') >= 0;
  var moved = migratePhotos();
  if (RAW_BEFORE && (ORDER_ADDED || moved || hadInlinePhotos || loaded === 'migrated')) downloadText(RAW_BEFORE, 'clan-backup-before-upgrade-' + stamp() + '.json');
  if (!cur()) S.currentClan = (liveClans()[0] || {}).id || null;
  save(); render();
  if (ORDER_ADDED) toast('Sibling order was added to your saved data — birth years were used once to start it. Check each family’s order with the arrows on the person page. A backup of the data as it was before was downloaded first.');
  else if (loaded === 'migrated') toast('Your earlier demo data was moved into a clan called “My clan”. Rename it in Clan settings. A backup of the old data was downloaded first.');
  else if (moved) toast(moved + ' portrait' + (moved === 1 ? '' : 's') + ' moved into the new photo store (backup of the old data downloaded first).');
  if (memoryOnly) toast('This browser blocks saving — changes will be lost on reload. Use Download backup.');
}
idbOpen().then(function (db) { IDB = db; IDB_OK = true; return idbAll(db); }).then(function (m) { IMG = m; }).catch(function () { IDB_OK = false; IMG = {}; }).then(boot);
})();
</script>
