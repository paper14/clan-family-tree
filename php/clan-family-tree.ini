; Loaded by start.bat / start-demo.bat through PHP_INI_SCAN_DIR.
; Camera photos are often 5-15 MB; the app keeps only a web-sized copy (480 / 1400 px),
; but the original has to reach PHP first to be resized.
upload_max_filesize = 40M
post_max_size = 48M
; Decoding a large photo in GD needs room (a 24-megapixel image is ~100 MB in memory).
memory_limit = 512M
max_execution_time = 300
